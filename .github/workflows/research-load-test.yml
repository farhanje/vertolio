name: Research Load Test

on:
  workflow_dispatch:
    inputs:
      test_type:
        description: "Which load test to run"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - stress
      base_url:
        description: "Target base URL"
        required: true
        default: "https://www.farhanje.com"
        type: string
      study_slug:
        description: "Test study slug"
        required: true
        default: "ai-support"
        type: string
      clicks_per_task:
        description: "Synthetic clicks per participant task"
        required: true
        default: "3"
        type: string
      think_time_seconds:
        description: "Pause between synthetic user actions"
        required: true
        default: "1"
        type: string

jobs:
  k6:
    name: Run k6 research load test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke test
        if: inputs.test_type == 'smoke'
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e STUDY_SLUG="${{ inputs.study_slug }}" \
            -e CLICKS_PER_TASK="${{ inputs.clicks_per_task }}" \
            grafana/k6:latest run load-tests/research-smoke.js

      - name: Run stress test
        if: inputs.test_type == 'stress'
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e BASE_URL="${{ inputs.base_url }}" \
            -e STUDY_SLUG="${{ inputs.study_slug }}" \
            -e CLICKS_PER_TASK="${{ inputs.clicks_per_task }}" \
            -e THINK_TIME_SECONDS="${{ inputs.think_time_seconds }}" \
            grafana/k6:latest run load-tests/research-stress.js
