name: One-Time Research Medium Load Test

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/research-one-time-medium.yml
      - load-tests/research-medium.js
  workflow_dispatch:

jobs:
  medium:
    name: Run k6 medium load test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run medium load test
        run: |
          docker run --rm \
            -v "$PWD:/work" \
            -w /work \
            -e BASE_URL="https://www.farhanje.com" \
            -e STUDY_SLUG="ai-support" \
            -e CLICKS_PER_TASK="3" \
            grafana/k6:latest run load-tests/research-medium.js
